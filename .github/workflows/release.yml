name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            "build/bin/pasta.exe"
            "build/bin/pasta_loader.exe"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }

          $project = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($project -notmatch 'project\s*\(\s*vesta\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not determine the project version."
          }
          $version = $Matches[1]
          $sha = $env:GITHUB_SHA
          $shortSha = $sha.Substring(0, 7)
          $runNumber = $env:GITHUB_RUN_NUMBER
          $runAttempt = [int]$env:GITHUB_RUN_ATTEMPT

          $tag = "v$version-build.$runNumber-$shortSha"
          if ($runAttempt -gt 1) {
            $tag += "-retry$runAttempt"
          }

          $previousTag = & gh release list --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) {
            $previousTag = ""
          }
          $changes = $null
          if ($previousTag -and $previousTag -ne $tag) {
            $changes = & git log "$previousTag..$sha" --no-merges --pretty=format:"- %s (%h)"
            if ($LASTEXITCODE -ne 0) {
              $changes = $null
            }
          }
          if (-not $changes) {
            $changes = & git log -20 --no-merges --pretty=format:"- %s (%h)" $sha
          }
          if (-not $changes) {
            $changes = @("- No commit messages were found for this release.")
          }

          $hashLines = @(
            foreach ($asset in $assets) {
              $name = Split-Path -Leaf $asset
              $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
              "- ``$name``: ``$hash``"
            }
          )
          $repositoryUrl = "${{ github.server_url }}/${{ github.repository }}"
          $runUrl = "$repositoryUrl/actions/runs/${{ github.run_id }}"
          $notes = @(
            "## Changes"
            ""
            ($changes -join "`n")
            ""
            "## Build"
            ""
            "- Commit: [$shortSha]($repositoryUrl/commit/$sha)"
            "- Workflow run: [$runNumber]($runUrl)"
            "- Files: ``pasta.exe`` and ``pasta_loader.exe``"
            ""
            "SHA-256:"
          ) + $hashLines + @(
            ""
            "License and third-party notices: [LICENSE]($repositoryUrl/blob/$sha/LICENSE) · [THIRD_PARTY_NOTICES.md]($repositoryUrl/blob/$sha/THIRD_PARTY_NOTICES.md)"
          )
          $notes -join "`n" | Set-Content -LiteralPath RELEASE_NOTES.md -Encoding utf8

          gh release create $tag `
            --target $sha `
            --title "PASTA $version build $runNumber" `
            --notes-file RELEASE_NOTES.md `
            $assets
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create release $tag."
          }
