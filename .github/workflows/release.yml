name: Release

on:
  push:
    tags: ["v*", "1.*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      # Every third-party library is downloaded at configure time from its pinned upstream release.
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Attest GitHub Actions build
        uses: actions/attest@v4
        with:
          subject-path: build/bin/vesta.exe
      - name: Attest loader build
        uses: actions/attest@v4
        with:
          subject-path: build/bin/pasta_loader.exe
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Both executables come from this same verified build.
          $assets = @(
            "build/bin/vesta.exe"
            "build/bin/pasta_loader.exe"
          )
          $assetNames = @($assets | ForEach-Object { ($_ -split '/')[-1] })
          $hashLines = @(
            foreach ($asset in $assets) {
              $name = ($asset -split '/')[-1]
              $sha256 = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
              "- ``$name``: ``$sha256``"
            }
          )

          $repositoryUrl = "${{ github.server_url }}/${{ github.repository }}"
          $runUrl = "$repositoryUrl/actions/runs/${{ github.run_id }}"
          $verificationNotes = @(
            "## Verified GitHub Actions build"
            ""
            "The attached vesta.exe and pasta_loader.exe were compiled from this tag by GitHub Actions. Their signed build provenance links the binaries to this repository, workflow run, commit, and tag."
            ""
            "Build: [$($env:GITHUB_SHA.Substring(0, 7))]($repositoryUrl/commit/$env:GITHUB_SHA) · [GitHub Actions run]($runUrl)"
            ""
            "SHA-256:"
            $hashLines
            ""
            "Verify the downloaded binaries with GitHub CLI:"
            ""
            '```powershell'
            "gh attestation verify .\\vesta.exe --repo ${{ github.repository }}"
            "gh attestation verify .\\pasta_loader.exe --repo ${{ github.repository }}"
            '```'
            ""
            "License and third-party notices: [LICENSE]($repositoryUrl/blob/$tag/LICENSE) · [THIRD_PARTY_NOTICES.md]($repositoryUrl/blob/$tag/THIRD_PARTY_NOTICES.md)"
          ) -join "`n"
          $changeLogPath = ".github/release-notes/$tag.md"
          if (Test-Path -LiteralPath $changeLogPath) {
            $changeLog = (Get-Content -LiteralPath $changeLogPath -Raw).Trim()
            $releaseNotes = "$changeLog`n`n$verificationNotes"
          } else {
            $releaseNotes = $verificationNotes
          }
          $releaseNotes | Set-Content -Encoding utf8 RELEASE_NOTES.md

          $releaseJson = gh release view $tag --json isDraft 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $tag already exists and is published. Immutable releases cannot be replaced."
            }
            # A draft left by an earlier run may hold other files; the published release must contain only our
            # two executables.
            $stale = @((gh release view $tag --json assets | ConvertFrom-Json).assets | ForEach-Object { $_.name } |
              Where-Object { $assetNames -notcontains $_ })
            foreach ($name in $stale) {
              gh release delete-asset $tag $name --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove $name from the draft release." }
            }
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release executables." }
            gh release edit $tag --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "Failed to update draft release notes." }
          } else {
            gh release create $tag `
              --verify-tag `
              --draft `
              --title "PASTA $tag" `
              --notes-file RELEASE_NOTES.md `
              $assets
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release." }
          }

          $draft = gh release view $tag --json assets,isDraft | ConvertFrom-Json
          $actualAssets = @($draft.assets | ForEach-Object { $_.name })
          if (-not $draft.isDraft -or $actualAssets.Count -ne $assetNames.Count -or
              -not ($actualAssets -contains "vesta.exe") -or -not ($actualAssets -contains "pasta_loader.exe")) {
            throw "Draft validation failed. Assets: $($actualAssets -join ', ')"
          }

          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish immutable release." }

          $published = gh api `
            -H "X-GitHub-Api-Version: 2026-03-10" `
            "repos/${{ github.repository }}/releases/tags/$tag" `
            | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $published.immutable) {
            throw "GitHub published $tag without immutable protection."
          }
